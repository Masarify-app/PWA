<head>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Masarify">

    <!-- Cross-Origin Isolation: required for SharedArrayBuffer / OPFS (SQLDelight WASM) on GitHub Pages -->
    <script>
      (function() {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.register("coi-serviceworker.js").then(function(reg) {
          if ((reg.installing || reg.waiting) && !navigator.serviceWorker.controller) {
            navigator.serviceWorker.addEventListener("controllerchange", function() {
              window.location.reload();
            });
          }
        });
      })();
    </script>
    <!-- Firebase Web SDK (compat) for FCM Web Push, Remote Config, and Analytics -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-remote-config-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
    <script>
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp({
          apiKey: "AIzaSyBvQw26WcbM0mm-c5EQ7-TiW77ZoM24iAg",
          authDomain: "masarify.firebaseapp.com",
          projectId: "masarify",
          storageBucket: "masarify.firebasestorage.app",
          messagingSenderId: "937375111830",
          appId: "1:937375111830:web:42e4fa31ca8ac80bf900b7"
        });
      }
    </script>
    <script>
      (function() {
        try {
          var p = new URLSearchParams(window.location.search);
          window.__masarifyUtm = {
            utm_source: p.get('utm_source'),
            utm_medium: p.get('utm_medium'),
            utm_campaign: p.get('utm_campaign'),
            utm_term: p.get('utm_term'),
            utm_content: p.get('utm_content'),
            ref: p.get('ref')
          };
        } catch(e) { window.__masarifyUtm = {}; }
      })();
    </script>
    <script src="lottie_light.min.js"></script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<div id="splash">
    <div id="lottie-container"></div>
</div>
<script>
  (function () {
    lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'animated_logo.json'
    });

    var splash = document.getElementById('splash');
    var observer = new MutationObserver(function () {
      var composeRoot = Array.from(document.body.children).find(function (el) {
        return el.id !== 'splash';
      });
      if (!composeRoot) return;
      observer.disconnect();
      splash.style.opacity = '0';
      setTimeout(function () { splash.parentNode && splash.parentNode.removeChild(splash); }, 400);
    });
    observer.observe(document.body, { childList: true });
  })();
</script>
</body>
</html>
